<style>

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brand h1{font-size:24px}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}

.tabs button small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.tabs button[aria-selected="true"]{border-color:var(--fg);background:var(--panel)}
main{padding-block:16px 120px;display:grid;gap:16px}
.sum{display:grid;gap:10px}
.sum p{margin:0;color:var(--muted);font-size:15px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px}

.facts b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}

.bar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden}

.opt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.opt span{font-size:13px;color:var(--muted)}
.opt button{font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}

.cnt{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap;padding-top:6px}

.card.done .spots{display:none}
.card.done.open .spots{display:grid}
.cfoot{display:flex;gap:14px;padding:0 12px 12px;font-size:14px}
.cfoot a{color:var(--c);font-weight:600}
.card.done .cfoot{display:none}
.notes{display:grid;gap:12px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.note h3{font-size:19px;margin-bottom:6px}
.note ul{margin:0;padding-left:18px;font-size:15px;display:grid;gap:4px}
.note.flag{border-left:4px solid var(--warn)}
.reset{font:inherit;font-size:14px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 12px;cursor:pointer;justify-self:start}
.reset.arm{border-color:var(--red);color:var(--red)}
.nextbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--fg);color:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.nextbar .inner{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nextbar .lbl{font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;opacity:.75}

.nextbar a{background:var(--bg);color:var(--fg);font-weight:700;padding:10px 14px;border-radius:10px;text-decoration:none;white-space:nowrap}

.map{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;overflow:hidden}
.map svg{display:block;width:100%;height:auto;max-height:70vh}
.map g[data-goto]{cursor:pointer}
.map .cap{font-size:12px;color:var(--muted);padding:4px 6px 2px}
</style>

    const sp=38,X0=44,Y={irv:120,add:210};vb="0 0 440 330";
    const xi=(k,i)=>k==="irv"?X0+(9-i)*sp:X0+i*sp;
    s+=`<rect x="414" y="0" width="26" height="330" fill="var(--chip)"/><text x="427" y="165" transform="rotate(90 427 165)" text-anchor="middle" fill="var(--muted)" font-family="var(--display)" font-size="13" letter-spacing="4">LAKE · HQ NORTH</text>`;
    const endx=mode==="wes"?X0+2*sp:X0;s+=`<path d="M${endx},${Y.irv} V${Y.add}" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4" fill="none"/><path d="M${X0+9*sp},${Y.irv} C${X0+9*sp+30},${Y.irv} ${X0+9*sp+30},${Y.add} ${X0+9*sp},${Y.add}" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4" fill="none"/>`;
    run.legs.forEach(leg=>{const list=stopsOf(run,leg),y=Y[leg.k],xs=list.map(o=>xi(leg.k,o.i)),up=leg.k==="irv";
      s+=`<line x1="${Math.min(...xs)}" y1="${y}" x2="${Math.max(...xs)}" y2="${y}" stroke="${leg.c}" stroke-width="5" stroke-linecap="round" opacity=".85"/><text x="${X0-10}" y="${up?18:322}" fill="${leg.c}" font-family="var(--display)" font-size="15" font-weight="700">${up?"← IRVING PARK · WEST":"ADDISON · EAST →"}</text>`;
      list.forEach((o,j)=>{const xx=xs[j],nm=o.s[0].split(" (")[0].split(" + ")[0].replace(/ (Ave|Rd|St|Dr)\b/g,"").replace("Lake Shore / Marine","LSD").replace("Lake Shore / Recreation","LSD");
        lab.push(`<text x="${xx}" y="${up?y-16:y+20}" transform="rotate(-50 ${xx} ${up?y-16:y+20})" text-anchor="${up?"start":"end"}" fill="var(--fg)" font-family="var(--body)" font-size="11">${nm}</text>`);lab.push(dot(xx,y,leg,o,j))})});
  }
  return `<div class="map"><svg viewBox="${vb}" role="img" aria-label="Route map for ${run.name}">${s}${lab.join("")}</svg><div class="cap">Schematic map. Tap a stop to jump to it. Green means done, a ring marks the next stop.</div></div>`;
}
let tab="r1",mode="cal",st={},openDone={};
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
tab=ls.get("sr-tab","r1");mode=ls.get("sr-mode","cal");st=ls.get("sr-state",{});
const save=()=>{ls.set("sr-tab",tab);ls.set("sr-mode",mode);ls.set("sr-state",st)};
const enc=s=>encodeURIComponent(s+", Chicago, IL");
const nav=q=>`https://www.google.com/maps/dir/?api=1&destination=${enc(q)}&travelmode=driving`;
const stopsOf=(run,leg)=>leg.stops.map((s,i)=>({s,i,f:s[4]||{}})).filter(o=>!(run.option&&mode==="wes"&&o.f.w));
const spotsOf=(run,o)=>o.s[3].map(t=>({t,x:false})).concat(run.option&&mode==="wes"&&o.f.x?o.f.x.map(t=>({t,x:true})):[]);
const key=(r,l,i)=>`${r}.${l}.${i}${mode==="wes"&&RUNS[r].option?".w":""}`;
const got=(k)=>st[k]||[];
function isDone(run,r,leg,o){const n=spotsOf(run,o).length,a=got(key(r,leg.k,o.i));return a.filter(Boolean).length>=n}
function render(){
  const run=RUNS[tab],app=document.getElementById("app");
  ["r1","r2"].forEach(r=>document.getElementById("tab-"+r).setAttribute("aria-selected",r===tab));
  let placed=0,total=0,next=null;
  run.legs.forEach(leg=>stopsOf(run,leg).forEach(o=>{const n=spotsOf(run,o).length;total+=n;placed+=Math.min(n,got(key(tab,leg.k,o.i)).filter(Boolean).length);if(!next&&!isDone(run,tab,leg,o))next={leg,o}}));
  let h=`<section class="sum">${mapSVG(tab,run,next)}<p>${run.sub}</p><div class="facts">${run.facts.map(f=>`<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join("")}<div><b>${placed}/${total}</b><span>Signs up</span></div></div><div class="bar"><i style="width:${total?placed/total*100:0}%"></i></div>`;
  if(run.option)h+=`<div class="opt"><span>Turn around at</span><button type="button" data-mode="cal" aria-pressed="${mode==="cal"}">California (full)</button><button type="button" data-mode="wes" aria-pressed="${mode==="wes"}">Western (short)</button></div><p style="font-size:14px">${mode==="cal"?"Full loop: take California north from Irving to Addison along the river.":"Short loop, about 25 minutes faster. The 10 signs from Rockwell and California go to the busiest middle stops as extra spots with a dashed outline. Each street still gets 50."}</p>`;
  h+=`</section>`;
  run.legs.forEach(leg=>{
    const list=stopsOf(run,leg);
    h+=`<section class="leg" style="--c:${leg.c}"><div class="leghead"><h2>${leg.t}</h2><a href="https://www.google.com/maps/dir/?api=1&origin=${enc(list[0].s[1])}&destination=${enc(list.at(-1).s[1])}&waypoints=${list.slice(1,-1).slice(0,8).map(o=>enc(o.s[1])).join("%7C")}&travelmode=driving" target="_blank" rel="noopener">Whole leg in Maps ↗</a></div>`;
    h+=`<div class="dots">${list.map(o=>`<i class="${isDone(run,tab,leg,o)?"on":""}"></i>`).join("")}</div>`;
    list.forEach((o,j)=>{
      const k=key(tab,leg.k,o.i),a=got(k),sp=spotsOf(run,o),d=isDone(run,tab,leg,o),isNext=next&&next.leg===leg&&next.o===o;
      const c=Math.min(sp.length,a.filter(Boolean).length);
      h+=`<article class="card${d?" done":""}${isNext?" next":""}${openDone[k]?" open":""}" id="c-${k.replace(/\./g,"-")}"><div class="chead" data-toggle="${k}"><span class="num">${d?"✓":j+1}</span><div style="min-width:0"><div class="cname">${o.s[0]}${o.f.also?`<span class="badge">Also ${o.f.also}</span>`:""}</div><div class="look">Look for: ${o.s[2]}</div></div><span class="cnt">${c}/${sp.length}</span></div>`;
      h+=`<ul class="spots">${sp.map((p,m)=>`<li><button type="button" class="${p.x?"extra":""}" aria-pressed="${!!a[m]}" data-k="${k}" data-m="${m}"><span class="box">${a[m]?"✓":""}</span><span>${p.x?"Extra: ":""}${p.t}</span></button></li>`).join("")}</ul>`;
      h+=`<div class="cfoot"><a href="${nav(o.s[1])}" target="_blank" rel="noopener">Directions ↗</a><span style="color:var(--muted)">${o.s[1]}</span></div></article>`;
    });
    h+=`</section>`;
  });
  h+=`<section class="notes">${NOTES[tab].map(n=>`<div class="note"><h3>${n[0]}</h3><ul>${n[1].map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}<div class="note flag"><h3>Both runs</h3><ul>${NOTES.both.map(x=>`<li>${x}</li>`).join("")}</ul></div><button type="button" class="reset" id="reset">Clear ${run.name} ticks</button></section>`;
  app.innerHTML=h;
  const nb=document.getElementById("nextbar");
  if(next){nb.hidden=false;document.getElementById("nb-lbl").textContent=`Next · ${next.leg.t}`;document.getElementById("nb-nm").textContent=next.o.s[0];document.getElementById("nb-go").href=nav(next.o.s[1])}
  else{document.getElementById("nb-lbl").textContent=`${run.name} done`;document.getElementById("nb-nm").textContent="Head back to HQ";document.getElementById("nb-go").href=nav("Foster Ave & Broadway")}
}
let armed=false;
document.getElementById("app").addEventListener("click",e=>{
  const g=e.target.closest("[data-goto]");if(g){const el=document.getElementById(g.dataset.goto);if(el)el.scrollIntoView({block:"center"});return}
  const b=e.target.closest("[data-k]");
  if(b){const k=b.dataset.k,m=+b.dataset.m,a=got(k).slice();const wasDone=e.target.closest(".card").classList.contains("done");a[m]=!a[m];st[k]=a;save();render();
    const card=document.querySelector(`#c-${k.replace(/\./g,"-")}`);
    if(!wasDone&&card&&card.classList.contains("done")){const nx=document.querySelector(".card.next");if(nx)nx.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})}
    return}
  const t=e.target.closest("[data-toggle]");if(t&&t.parentElement.classList.contains("done")){openDone[t.dataset.toggle]=!openDone[t.dataset.toggle];render();return}
  const md=e.target.closest("[data-mode]");if(md){mode=md.dataset.mode;save();render();return}
  if(e.target.id==="reset"){if(!armed){armed=true;e.target.textContent="Tap again to clear";e.target.classList.add("arm");setTimeout(()=>{armed=false;render()},3000);return}
    armed=false;Object.keys(st).forEach(k=>{if(k.startsWith(tab+"."))delete st[k]});save();render()}
});
["r1","r2"].forEach(r=>document.getElementById("tab-"+r).addEventListener("click",()=>{tab=r;save();render();scrollTo(0,0)}));
render();
</script>
